name: KMR V Genos 2 Windows

on:
  push:
    branches: [ marco/genos2-study ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: JUCE
        run: git clone --depth 1 --branch 8.0.13 https://github.com/juce-framework/JUCE.git lib/JUCE
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: FluidSynth
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/FluidSynth/fluidsynth/releases/download/v2.6.1/fluidsynth-v2.6.1-win10-x64-cpp11.zip -OutFile fluidsynth.zip
          if ((Get-FileHash fluidsynth.zip -Algorithm SHA256).Hash.ToLower() -ne 'fab7a2e4b85675b66970f97a39bbc239729c5e0f237198b5922a6a73cbc8677c') { throw 'FluidSynth checksum mismatch' }
          Expand-Archive fluidsynth.zip -DestinationPath deps
      - name: Configure
        shell: pwsh
        run: |
          $fluid = (Resolve-Path deps/fluidsynth-v2.6.1-win10-x64-cpp11/lib/cmake/fluidsynth).Path.Replace('\','/')
          cmake -S . -B build-genos -G Ninja -DCMAKE_BUILD_TYPE=Release "-DFluidSynth_DIR=$fluid"
      - name: Build
        run: cmake --build build-genos --parallel 4
      - name: Test
        run: ctest --test-dir build-genos --output-on-failure
      - name: Preserve failed verification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KMR-V-Genos-2-Verification-Diagnostics
          path: |
            build-genos/Testing/Temporary/LastTest.log
            build-genos/genos2-*.png
          retention-days: 14
      - name: Assemble portable application
        shell: pwsh
        run: |
          $out = 'package/KMR V Genos 2'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'build-genos/Cadenza_artefacts/Release/KMR V Genos 2.exe' $out
          Copy-Item resources "$out/resources" -Recurse
          Copy-Item deps/fluidsynth-v2.6.1-win10-x64-cpp11/bin/*.dll $out
          Copy-Item LICENSE,NOTICE "$out/"
          Copy-Item docs/GENOS2_INTERFACE.md "$out/"
          Copy-Item docs/KMR_V_GENOS_2_README.md "$out/LIRE-MOI.md"
          Copy-Item build-genos/genos2-*.png "$out/"
          Copy-Item build-genos/Testing/Temporary/LastTest.log "$out/verification-tests.log"
          Copy-Item deps/fluidsynth-v2.6.1-win10-x64-cpp11/COPYING* "$out/" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: KMR-V-Genos-2-Windows
          path: package/
          retention-days: 14
